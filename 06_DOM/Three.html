<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai aur code |DOM</title>
</head>
<body style="background-color : #212121 ; color : #fff">
    <ul class="language">
        <li>Javascript</li>
    </ul>
    
</body>

<script>
    function addLanguage(langName){
        const li = document.createElement('li');

        <!--While using innerHtml kinda tags traversing of the whole tree is done which is not optimised-->

        li.innerHTML = `${langName}`;
         document.querySelector('.language').appendChild(li);

    }

    addLanguage("Python");
    addLanguage("TypeScript");

  
    function addOptiLanguage(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);

    }

    addOptiLanguage('golang');

    //Edit
    // In JavaScript, li:nth-child() refers to a CSS pseudo-class that is used to select elements based on their position within a parent element. Specifically, li:nth-child() is targeting the li (list item) elements that are in a certain position in the list. This can be useful when you want to apply styles or behaviors to specific elements within a list based on their order.
     const secondLang = document.querySelector("li:nth-child(3)");
     console.log(secondLang);
     const newli = document.createElement('li');
     newli.textContent = "Mojo";
     secondLang.replaceWith(newli);

     //Edit 
     const firstLang = document.querySelector("li:first-child");
     firstLang.outerHTML = '<li>TypeScript</li>';


     // Remove
     const lastLang = document.querySelector("li:first-child");
     lastLang.remove();

</script>
</html>
